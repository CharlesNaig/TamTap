<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMTAP - NFC-Based Attendance System</title>
    <link rel="icon" type="image/png" href="/assets/TamTap-3D.png">
    <link rel="apple-touch-icon" href="/assets/TamTap-3D.png">
    <link rel="stylesheet" href="/css/preloader.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <script src="/js/preloader.js"></script>
    <style>body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }</style>
</head>
<body>
    <script>
        // Check authentication and redirect appropriately
        async function checkAndRedirect() {
            try {
                const res = await fetch('/api/auth/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) {
                        window.location.replace('/dashboard');
                        return;
                    }
                }
            } catch (e) {
                // Error - redirect to login
            }
            
            window.location.replace('/login');
        }
        
        checkAndRedirect();
    </script>
</body>
</html>
